[project]
name = "docs-rag-agent"
version = "0.1.0"
description = "RAG + agent over the FastAPI documentation, with a swappable multi-provider LLM layer."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Madara" }
]
dependencies = [
    "fastapi ~= 0.115",
    "uvicorn[standard] ~= 0.32",
    "pydantic ~= 2.9",
    "pydantic-settings ~= 2.6",
    "google-genai ~= 0.3",
    "anthropic >= 0.40",
    "openai >= 1.0",
    "qdrant-client ~= 1.12.0",
    "fastembed ~= 0.4",
    "httpx ~= 0.27",
    "python-dotenv ~= 1.0",
    "typer ~= 0.13",
]

[project.optional-dependencies]
dev = [
    "pytest ~= 8.3",
    "pytest-asyncio ~= 0.24",
    "ruff ~= 0.7",
    "mypy ~= 1.13",
]
langfuse = [
    "langfuse ~= 2.0",
]
ui = [
    "streamlit ~= 1.40",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"src/docs_rag_agent/ingest/pipeline.py" = ["B008"]
"scripts/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore::UserWarning:pydantic.*",
]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
